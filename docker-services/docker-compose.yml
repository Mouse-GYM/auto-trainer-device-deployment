# Services that will be run regardless of environment and will not be built locally as part of development.
services:
  api:
    image: ghcr.io/mouse-gym/auto-trainer-device-service:latest
    pull_policy: always
    hostname: auto-trainer-device-service
    environment:
      TZ: "${AUTOTRAINER_TZ:-America/Denver}"
      Autotrainer__CommandQueue__Connection: "tcp://${CERT_DOMAIN}:5557"
      Autotrainer__MessageQueue__Connection: "tcp://${CERT_DOMAIN}:5556"
      Autotrainer__Aws__Region: "${AUTOTRAINER_AWS_REGION:-us-east-2}"
      Autotrainer__Aws__AccessKeyId: "${AUTOTRAINER_AWS_ACCESS_KEY_ID}"
      Autotrainer__Aws__AccessKey: "${AUTOTRAINER_AWS_ACCESS_KEY}"
      Autotrainer__Aws__Sns__TopicArn: "${AUTOTRAINER_AWS_SNS_TOPIC_ARN}"
      Autotrainer__Aws__Cognito__UserPoolId: "${AUTOTRAINER_AWS_COGNITO_USER_POOL_ID}"
      Autotrainer__Aws__Cognito__ClientId: "${AUTOTRAINER_AWS_COGNITO_CLIENT_ID}"
      Autotrainer__WebRtc__AdvertisedAddress: "${CERT_DOMAIN}"
      Autotrainer__WebRtc__DownscaleFactor: 2
    volumes:
      - "${AUTOTRAINER_LOG_VOLUME}:/var/log/autotrainer"
      - "${AUTOTRAINER_DATABASE_VOLUME}:/data/autotrainer"
      - "/home/autotrainer:/home/autotrainer"
      - ./certs:/certs:ro
    ports:
      - "5150:443"
      - "8556-8564:8556-8564/udp"
    networks:
      - autotrainer
    depends_on:
      cert-manager:
        condition: service_healthy
    restart: always

  cert-manager:
    image: alpine:3.21
    entrypoint: [ "/bin/sh", "/scripts/entrypoint.sh" ]
    environment:
      - CERT_DOMAIN=${CERT_DOMAIN}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./cert-manager:/scripts:ro
      - ./certs:/certs
      - acme-data:/acme
    healthcheck:
      test: [ "CMD", "test", "-f", "/tmp/certs-ready" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    networks:
      - autotrainer
    restart: always

networks:
  autotrainer:
volumes:
  acme-data: